name: Update README timestamp

on:
  schedule:
    # 12時間ごとに実行 (UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README timestamp in place
        run: |
          # 空行を増やさず、末尾の更新コメントだけを置き換える
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          if grep -q '<!-- Last updated:' README.md; then
            sed -i "s|<!-- Last updated:.*-->|<!-- Last updated: ${TIMESTAMP} -->|" README.md
          else
            printf '\n<!-- Last updated: %s -->\n' "$TIMESTAMP" >> README.md
          fi

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update README timestamp [skip ci]"
          git push
